<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Roman</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      .splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 12px 16px 16px;
      }
      .art-wrap {
        position: relative;
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .art {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        object-position: center center;
        pointer-events: none;
        user-select: none;
        display: block;
      }
      /* Barre fonctionnelle superposée au bas du visuel (ajuste % si besoin) */
      .progress-shell {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 9%;
        width: 70%;
        max-width: 340px;
        z-index: 2;
      }
      .progress-track {
        position: relative;
        height: 7px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        box-shadow:
          inset 0 1px 3px rgba(0, 0, 0, 0.75),
          0 0 0 1px rgba(212, 175, 55, 0.45);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          #a16207 0%,
          #fbbf24 45%,
          #fde68a 70%,
          #fbbf24 100%
        );
        box-shadow:
          0 0 14px rgba(251, 191, 36, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        will-change: width;
      }
      .splash.waiting .progress-fill {
        background: linear-gradient(
          90deg,
          #92400e 0%,
          #fbbf24 35%,
          #fff7ed 50%,
          #fbbf24 65%,
          #92400e 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.1s linear infinite;
      }
      @keyframes shimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash">
      <div class="art-wrap">
        <img src="/splash-loading.png" alt="" class="art" width="512" height="512" />
        <div class="progress-shell">
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      ;(function () {
        var fill = document.getElementById('progressFill')
        var root = document.getElementById('splash')
        var start = performance.now()
        var duration = 4800
        var maxPct = 96
        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3)
        }
        function tick(now) {
          var elapsed = now - start
          var t = Math.min(1, elapsed / duration)
          var pct = easeOutCubic(t) * maxPct
          fill.style.width = pct + '%'
          if (t < 1) {
            requestAnimationFrame(tick)
          } else {
            fill.style.width = '100%'
            root.classList.add('waiting')
          }
        }
        requestAnimationFrame(tick)
      })()
    </script>
  </body>
</html>
