name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contract:
    name: API contract (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: scriptor/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: OpenAPI lint
        run: npm run openapi:lint

  frontend:
    name: Frontend (scriptor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scriptor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: scriptor/.nvmrc
          cache: npm
          cache-dependency-path: scriptor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Security audit gate
        run: npm run security:audit

      - name: OpenAPI drift check
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
          node scripts/check-openapi-drift.mjs "origin/${{ github.base_ref }}"

  backend:
    name: Backend (spring)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: mvn -q compile -DskipTests -Dskip.npm=true

      - name: Test
        run: mvn -q test -Dskip.npm=true
