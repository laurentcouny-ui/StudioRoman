version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/scriptor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
